<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riot-login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="principal">
        <div class="login">

            <div>
                <img class="logo" src="image/riot-logo.png" alt="">

            </div>

            <span>SIGN IN</span>

            <div class="nome-senha">
                <input type="text"><p>
                <input type="text">
            </div>
            <div class="salvar-senha">
                <button type="button" class="remember-buttom"></button>
                <span class="frase">Remember me</span>
                <span class="frase2">Forgot password</span>

            </div>
            <div class="logar-criar">
                <button type="button" class="sign-buttom">Sign In</button> 
                <p>
                <span>Dont have an Account? Sign Up</span>
            </div>
            <p>      ________________________________________________        </p>
            <p>Or Sign With</p>
            <div class="logos">
                <button type="button"><img src="image/icons8-google-logo-48.png" alt=""></button>
                <button type="button"><img src="image/icons8-xbox-50.png" alt=""></button>
            </div>

        </div>


    </main>
</body>

</html>
